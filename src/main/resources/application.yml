spring:
  application:
    name: akmai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/akmai}
    username: ${DB_USERNAME:akmai}
    password: ${DB_PASSWORD:akmai}

  ai:
    model:
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${AKMAI_EMBEDDING_MODEL:qwen3-embedding:0.6b}
      chat:
        options:
          model: ${AKMAI_CHAT_MODEL:qwen3:8b}
          temperature: 0.1

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE

akmai:
  ingestion:
    parallelism: ${AKMAI_INGESTION_PARALLELISM:8}
  retrieval:
    parallelism: ${AKMAI_RETRIEVAL_PARALLELISM:8}
  chunking:
    target-tokens: 750
    soft-max-tokens: 1200
    hard-max-tokens: 1800
    min-tokens: 250

server:
  port: ${SERVER_PORT:8080}
