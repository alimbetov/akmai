name: Retrieval Storage Benchmark

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Number of vectors/chunks
        required: true
        default: "100000"
      dimensions:
        description: Vector dimensions
        required: true
        default: "64"
      access_levels:
        description: Number of ACL values
        required: true
        default: "8"
      chunks_per_document:
        description: Chunks per document
        required: true
        default: "300"
      warmups:
        description: Warmup iterations per layout
        required: true
        default: "5"
      iterations:
        description: Measured iterations per layout
        required: true
        default: "20"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AKMAI_RUN_RETRIEVAL_BENCHMARK: "true"
      AKMAI_BENCHMARK_ROWS: ${{ inputs.rows || '50000' }}
      AKMAI_BENCHMARK_DIMENSIONS: ${{ inputs.dimensions || '32' }}
      AKMAI_BENCHMARK_ACCESS_LEVELS: ${{ inputs.access_levels || '4' }}
      AKMAI_BENCHMARK_CHUNKS_PER_DOCUMENT: ${{ inputs.chunks_per_document || '300' }}
      AKMAI_BENCHMARK_WARMUPS: ${{ inputs.warmups || '3' }}
      AKMAI_BENCHMARK_ITERATIONS: ${{ inputs.iterations || '10' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Formatting
        run: mvn -B spotless:check

      - name: Run retrieval storage benchmark
        run: >
          mvn -B
          -Dtest=RetrievalStorageLayoutBenchmarkTest
          test

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-storage-benchmark-${{ github.run_id }}
          path: target/retrieval-benchmark/layout-report.json
          if-no-files-found: error
          retention-days: 30
