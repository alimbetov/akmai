name: CI
# production lifecycle hardening compile gate

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "audit/**"
      - "quality/**"
      - "docs/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Formatting
        run: mvn -B spotless:check
      - name: Test and verify
        shell: bash
        run: |
          set -o pipefail
          mvn -B clean verify 2>&1 | tee maven-verify.log
      - name: Upload verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-diagnostics-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            maven-verify.log
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
