name: Retrieval Quality Gate

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Formatting
        run: mvn -B spotless:check

      - name: Production retrieval quality and routing
        run: >
          mvn -B
          -Dtest=QueryLanguageDetectorTest,MultilingualChunkingRulesTest,MultilingualRetrievalQualityRegressionTest,PublishedVectorSearchIntegrationTest,PostgresRetrievalIntegrationTest
          test
