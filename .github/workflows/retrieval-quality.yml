name: Retrieval Quality Gate

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Formatting
        run: mvn -B spotless:check

      - name: Production retrieval quality, graph replay and routing
        run: >
          mvn -B
          -Dtest=QueryLanguageDetectorTest,MultilingualChunkingRulesTest,IndustryProfileLanguageCoverageTest,IndustryProfileSemanticRulesTest,SemanticDomainCatalogTest,SemanticLexiconRegistryTest,SemanticDomainRouterTest,SemanticChunkAnnotatorTest,SemanticProjectionPropagationTest,EnglishSemanticConceptCatalogTest,EnglishSemanticConceptMatcherTest,EnglishSemanticConceptAnnotationTest,EnglishSemanticMorphologyNormalizerTest,SemanticMorphologyRegistryTest,SemanticConceptSurfaceRegistryTest,MultilingualRetrievalQualityRegressionTest,PublishedVectorSearchIntegrationTest,PostgresRetrievalIntegrationTest,AnswerGroundingVerifierTest,TemporalAuthorityFilterTest,RagFallbackMessagesTest,RagQuestionServiceAssuranceTest,AdaptiveGraphScoreCalculatorTest,AssociationLearningRecorderTest,AdaptiveGraphReplayUtilityTest,AdaptiveGraphThresholdCalibratorTest,GraphReplayHarnessTest,AdaptiveGraphReplayQualityGateTest
          test

      - name: Upload adaptive graph replay report
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-graph-replay-report
          path: target/quality/adaptive-graph-replay-report.json
          if-no-files-found: error
