name: Retrieval Quality Gate

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "audit/**"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Formatting
        run: mvn -B spotless:check

      - name: Production retrieval quality, graph replay and routing
        run: >
          mvn -B
          -Dtest=QueryLanguageDetectorTest,MultilingualChunkingRulesTest,IndustryProfileLanguageCoverageTest,IndustryProfileSemanticRulesTest,SemanticDomainCatalogTest,SemanticLexiconRegistryTest,SemanticDomainRouterTest,SemanticChunkAnnotatorTest,SemanticProjectionPropagationTest,EnglishSemanticConceptCatalogTest,EnglishSemanticConceptMatcherTest,EnglishSemanticConceptAnnotationTest,EnglishSemanticMorphologyNormalizerTest,SemanticMorphologyRegistryTest,SemanticConceptSurfaceRegistryTest,SemanticConceptAliasExpansionTest,RussianKazakhSemanticMorphologyTest,ChineseSemanticMorphologyNormalizerTest,EuropeanSemanticMorphologyNormalizerTest,TurkishGreekSemanticMorphologyTest,MultilingualSemanticSurfaceRoundTripTest,MultilingualSemanticConceptMatcherTest,MultilingualSemanticConceptAnnotationTest,SemanticQueryAnalyzerTest,RetrievalPlannerTest,PhaseBRetrievalAcceptanceTest,SemanticConceptGoldenSetTest,SemanticConceptRetrievalGoldenSetTest,LexicalRetrievalStrategySemanticTest,ConceptRetrievalStrategyTest,RerankerTest,MultilingualRetrievalQualityRegressionTest,PublishedVectorSearchIntegrationTest,PostgresRetrievalIntegrationTest,AnswerGroundingVerifierTest,TemporalAuthorityFilterTest,RagFallbackMessagesTest,RagQuestionServiceAssuranceTest,AdaptiveGraphScoreCalculatorTest,AdaptiveGraphUtilityRecorderTest,AssociationLearningRecorderTest,AdaptiveGraphReplayUtilityTest,AdaptiveGraphThresholdCalibratorTest,GraphReplayHarnessTest,AdaptiveGraphReplayQualityGateTest
          test

      - name: Upload retrieval quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-quality-surefire-reports
          path: |
            target/surefire-reports
            src/main/resources/semantic/concept-aliases-global-v1.yaml
            src/main/resources/semantic/concept-surfaces-zh-v1.yaml
            src/main/resources/semantic/concept-surfaces-de-v1.yaml
            src/main/resources/semantic/concept-surfaces-fr-v1.yaml
            src/main/resources/semantic/concept-surfaces-es-v1.yaml
            src/main/resources/semantic/concept-surfaces-pt-v1.yaml
            src/main/resources/semantic/concept-surfaces-it-v1.yaml
            src/main/resources/semantic/concept-surfaces-tr-v1.yaml
            src/main/resources/semantic/concept-surfaces-el-v1.yaml
          if-no-files-found: warn

      - name: Upload adaptive graph replay report
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-graph-replay-report
          path: target/quality/adaptive-graph-replay-report.json
          if-no-files-found: error
