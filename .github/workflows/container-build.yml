name: Production Image Build

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pom.xml"
      - "src/**"
      - ".github/workflows/container-build.yml"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Grafana dashboard JSON
        run: python -m json.tool ops/grafana/akmai-production-overview.json > /dev/null

      - name: Build production image
        run: docker build --tag akmai:ci .
