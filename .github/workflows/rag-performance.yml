name: RAG Performance Harness

on:
  workflow_dispatch:
    inputs:
      scale:
        description: Operation multiplier for the performance matrix
        required: false
        default: "1"
      corpus_tier:
        description: Attribution label for the loaded corpus tier (SMOKE/SMALL/MEDIUM)
        required: false
        default: "SMOKE"
      ingest_concurrency:
        description: Concurrent ingestion operations for ingest-only scenarios
        required: false
        default: "8"
      p95_ms:
        description: Maximum allowed read-10 p95 latency in milliseconds
        required: false
        default: "15000"
  push:
    tags:
      - "v*"

jobs:
  rag-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Formatting
        run: mvn -B spotless:check

      - name: Require live Ollama configuration
        env:
          AKMAI_LIVE_OLLAMA_BASE_URL: ${{ secrets.AKMAI_LIVE_OLLAMA_BASE_URL }}
        run: test -n "$AKMAI_LIVE_OLLAMA_BASE_URL"

      - name: Run application-level RAG performance matrix
        env:
          AKMAI_LIVE_PERFORMANCE: "true"
          AKMAI_LIVE_OLLAMA_BASE_URL: ${{ secrets.AKMAI_LIVE_OLLAMA_BASE_URL }}
          AKMAI_LIVE_PERFORMANCE_SCALE: ${{ inputs.scale || '1' }}
          AKMAI_LIVE_PERFORMANCE_CORPUS_TIER: ${{ inputs.corpus_tier || 'SMOKE' }}
          AKMAI_LIVE_INGEST_CONCURRENCY: ${{ inputs.ingest_concurrency || '8' }}
          AKMAI_LIVE_PERFORMANCE_P95_MS: ${{ inputs.p95_ms || '15000' }}
          GITHUB_SHA: ${{ github.sha }}
          AKMAI_RUNTIME_PROFILE: github-actions
        run: >
          mvn -B
          -Dtest=LiveRagPerformanceHarnessTest
          test

      - name: Upload RAG performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-performance-v1.1-${{ inputs.corpus_tier || 'SMOKE' }}
          path: target/performance/performance-baseline.json
          if-no-files-found: warn
