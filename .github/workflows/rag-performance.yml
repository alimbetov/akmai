name: RAG Performance Harness

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: Concurrent RAG operations
        required: false
        default: "4"
      requests:
        description: Read operations
        required: false
        default: "22"
      mixed_requests:
        description: Mixed read/write operations
        required: false
        default: "20"
  push:
    tags:
      - "v*"

jobs:
  rag-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Formatting
        run: mvn -B spotless:check

      - name: Require live Ollama configuration
        env:
          AKMAI_LIVE_OLLAMA_BASE_URL: ${{ secrets.AKMAI_LIVE_OLLAMA_BASE_URL }}
        run: test -n "$AKMAI_LIVE_OLLAMA_BASE_URL"

      - name: Run application-level RAG performance harness
        env:
          AKMAI_LIVE_PERFORMANCE: "true"
          AKMAI_LIVE_OLLAMA_BASE_URL: ${{ secrets.AKMAI_LIVE_OLLAMA_BASE_URL }}
          AKMAI_LIVE_PERFORMANCE_CONCURRENCY: ${{ inputs.concurrency || '4' }}
          AKMAI_LIVE_PERFORMANCE_REQUESTS: ${{ inputs.requests || '22' }}
          AKMAI_LIVE_PERFORMANCE_MIXED_REQUESTS: ${{ inputs.mixed_requests || '20' }}
        run: >
          mvn -B
          -Dtest=LiveRagPerformanceHarnessTest
          test

      - name: Upload RAG performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-performance-v1
          path: target/performance/performance-baseline.json
          if-no-files-found: warn
