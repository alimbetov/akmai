name: Retrieval Storage Decision Matrix

on:
  pull_request:
    paths:
      - "src/test/java/kz/alimbetov/akmai/knowledge/vector/RetrievalStorageDecisionMatrixBenchmarkTest.java"
      - ".github/workflows/retrieval-storage-decision-matrix.yml"
  workflow_dispatch:
    inputs:
      dimensions:
        description: Vector dimensions
        required: true
        default: "1024"
      rows_per_acl:
        description: Rows/vectors per ACL partition
        required: true
        default: "2000"
      chunks_per_document:
        description: Chunks per document
        required: true
        default: "300"
      warmups:
        description: Warmup iterations
        required: true
        default: "3"
      iterations:
        description: Measured single-thread iterations
        required: true
        default: "10"
      concurrent_iterations:
        description: Measured iterations per concurrent worker
        required: true
        default: "10"
      concurrency:
        description: Comma-separated concurrency levels
        required: true
        default: "1,4,16"

jobs:
  matrix:
    name: ACL ${{ matrix.access_levels }} / 1024d
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        access_levels: [1, 2, 4, 8, 16]

    env:
      AKMAI_RUN_RETRIEVAL_DECISION_MATRIX: "true"
      AKMAI_MATRIX_DIMENSIONS: ${{ inputs.dimensions || '1024' }}
      AKMAI_MATRIX_ACCESS_LEVELS: ${{ matrix.access_levels }}
      AKMAI_MATRIX_ROWS_PER_ACL: ${{ inputs.rows_per_acl || '1200' }}
      AKMAI_MATRIX_CHUNKS_PER_DOCUMENT: ${{ inputs.chunks_per_document || '300' }}
      AKMAI_MATRIX_WARMUPS: ${{ inputs.warmups || '2' }}
      AKMAI_MATRIX_ITERATIONS: ${{ inputs.iterations || '6' }}
      AKMAI_MATRIX_CONCURRENT_ITERATIONS: ${{ inputs.concurrent_iterations || '6' }}
      AKMAI_MATRIX_CONCURRENCY: ${{ inputs.concurrency || '1,4,16' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Formatting
        run: mvn -B spotless:check

      - name: Run decision matrix scenario
        run: >
          mvn -B
          -Dtest=RetrievalStorageDecisionMatrixBenchmarkTest
          test

      - name: Upload decision report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-decision-acl-${{ matrix.access_levels }}-${{ github.run_id }}
          path: target/retrieval-benchmark/decision-matrix-acl-*.json
          if-no-files-found: error
          retention-days: 30
