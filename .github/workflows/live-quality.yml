name: Live Retrieval Quality

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  live-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Formatting
        run: mvn -B spotless:check

      - name: Deterministic production quality gate
        run: >
          mvn -B
          -Dtest=MultilingualRetrievalQualityRegressionTest
          test

      - name: Require live Ollama configuration
        env:
          AKMAI_LIVE_OLLAMA_BASE_URL: ${{ secrets.AKMAI_LIVE_OLLAMA_BASE_URL }}
        run: |
          test -n "$AKMAI_LIVE_OLLAMA_BASE_URL"

      - name: Live multilingual embedding quality
        env:
          AKMAI_LIVE_QUALITY: "true"
          AKMAI_LIVE_OLLAMA_BASE_URL: ${{ secrets.AKMAI_LIVE_OLLAMA_BASE_URL }}
        run: >
          mvn -B
          -Dtest=LiveEmbeddingRetrievalQualityTest
          test
