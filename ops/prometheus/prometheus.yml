global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/akmai-alerts.yml

scrape_configs:
  - job_name: akmai
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/akmai_api_key
    static_configs:
      - targets:
          - akmai:8080
